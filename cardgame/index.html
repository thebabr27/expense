    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');

        * {

            font-family: 'Luckiest Guy', cursive;
        }

        .bg-semi-transparent {
            background: rgba(0, 0, 0, .5) !important;
        }

        .bg-semi-transparent h3 {
            color: white;
        }

        .opponents-board {
            position: fixed;
            top: 36%;
            right: 0;

            transform: translateY(-50%);

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 10px;

            pointer-events: none;
        }

        .flex-column:has(.opponent-cards) {
            height: 70vh;
        }

        .opponent-cards {
            margin-bottom: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
        }

        .opponent-card {
            width: 0px;
            height: 35px;
            margin-top: -15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .opponent-card .deck-card.uno-back {
            width: 140px;
            height: 200px;

            transform: rotate(90deg) scale(0.45);

            transform-origin: center center;

            flex-shrink: 0;
        }

        .card {
            border-radius: 20px;
            transform: scale(.8);
        }

        @media (max-width: 600px) {

            .card:has(.uno-back):hover {
                transform: translateY(-15px) scale(.6) !important;
            }

            .card:has(.uno-back),
            .card {
                transform: translateY(0px) scale(.6) !important;
            }

            /* Effetto hover */
            .card:has(.uno):hover,
            .card:has(.denari):hover {
                transform: translateY(-8px) scale(.6) !important;
            }
        }

        .card-body {
            padding: 0;
        }

        /* Colori Scopa */
        .deck-denari,
        .deck-spade,
        .deck-bastoni,
        .deck-coppe {
            background-color: #FFF;
        }

        /* =========================
   DORSO CARTA UNO
   ========================= */

        .deck-card.uno-back {
            position: relative;

            width: 140px;
            height: 200px;

            background: #000;

            border: 4px solid #fff;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;


            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.45),
                inset 0 0 0 2px rgba(255, 255, 255, 0.15);
        }


        /* =========================
   OVALE ROSSO
   ========================= */
        .card:has(.uno-back-oval) {
            transition: .2s;
            transform: scale(.8);
        }

        .card:has(.uno-back-oval):hover {
            transform: translateY(-15px) scale(.8);
        }

        .uno-back-oval {
            transition: .2s;
            width: 115px;
            height: 165px;

            background: #ed1c24;

            border: 4px solid #fff;
            border-radius: 50%;

            box-sizing: border-box;

            transform: rotate(27deg) skewX(-8deg);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                3px 4px 5px rgba(0, 0, 0, 0.45);
        }

        .card-content {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* =========================
   SCRITTA UNO
   ========================= */

        .uno-back-oval span {
            position: relative;

            color: #ffde17;
            text-shadow:
                0 0 2px #fff,
                0 0 5px #fff,
                0 0 8px rgba(255, 255, 255, 0.9),
                3px 4px 0 rgba(0, 0, 0, 0.45),
                4px 5px 4px rgba(0, 0, 0, 0.35);


            font-size: 50px;
            font-weight: 500;

            letter-spacing: 3px;

            /*
     * Compensa il rotate(27deg)
     * dell'ovale.
     */
            transform: rotate(-50deg);

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.25);

            white-space: nowrap;
        }

        /* =========================
   UNO WILD - CAMBIO COLORE
   ========================= */

        /* =========================
   SIMBOLO WILD - CAMBIO COLORE
   ========================= */

        /* =========================
   WILD - CAMBIO COLORE
   ========================= */
        .uno-deck-wild .uno-symbol-wild {

            transform: rotate(45deg) scale(1.5);
        }

        .uno-symbol-wild {
            position: relative;

            width: 82px;
            height: 118px;

            border: 4px solid #fff;
            border-radius: 50%;

            box-sizing: border-box;

            overflow: hidden;

            transform: rotate(-25deg) skewX(-8deg);

            background:
                conic-gradient(from 0deg,
                    #0072bc 0deg 45deg,
                    #00a651 45deg 155deg,
                    #ffde17 155deg 225deg,
                    #ed1c24 225deg 335deg,
                    #0072bc 335deg 360deg);

            box-shadow:
                2px 4px 4px rgba(0, 0, 0, 0.4);
        }


        /* =========================
   QUATTRO QUARTI
   ========================= */

        .wild-quarter {
            position: absolute;

            width: 50%;
            height: 50%;

            box-sizing: border-box;
        }


        /* BLU - alto sinistra */
        .wild-blue {
            top: 0;
            left: 0;
            background: #0072bc;
        }


        /* VERDE - alto destra */
        .wild-green {
            top: 0;
            right: 0;
            background: #00a651;
        }


        /* GIALLO - basso sinistra */
        .wild-yellow {
            bottom: 0;
            left: 0;
            background: #ffde17;
        }


        /* ROSSO - basso destra */
        .wild-red {
            bottom: 0;
            right: 0;
            background: #ed1c24;
        }

        /* =========================
   UNO SKIP / DIVIETO
   ========================= */

        .uno-skip {
            position: relative;

            width: 82px;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
   CERCHIO
   ========================= */

        .skip-circle {
            width: 65px;
            height: 65px;
            border: 9px solid #fff;
            border-radius: 50%;
            box-sizing: border-box;
            /* Ombra del cerchio */
            filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.45));
        }


        /* =========================
   BARRA DI DIVIETO
   ========================= */

        .skip-bar {
            position: absolute;
            margin-left: 1px;
            margin-top: 1px;
            width: 60px;
            height: 10px;
            background: #fff;
            border-radius: 6px;
            transform: rotate(-45deg);
        }

        /* =========================
   UNO REVERSE
   ========================= */

        .uno-reverse,
        .uno-reverse-small {
            position: relative;
            width: 80px;
            height: 80px;

        }


        /* Base comune delle frecce */
        .reverse-arrow {
            position: absolute;

            width: 33px;
            height: 14px;

            background: #fff;

            border-radius: 3px;

            transform-origin: center;

        }

        /* Punta triangolare */
        .reverse-arrow::after {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #fff;

            /* Ombra della punta */
            filter: drop-shadow(2px -3px 2px rgba(0, 0, 0, 0.45));
        }


        /* =========================
   FRECCIA ↗
   ========================= */

        .reverse-arrow-up {
            border-top-left-radius: 10px;
            top: 24px;
            left: 20px;
            transform: rotate(-41deg);
            box-shadow: -2px -3px 3px rgba(0, 0, 0, 0.45);
        }

        .reverse-arrow-up::after {
            right: -22px;
            top: -8px;

        }


        /* =========================
   FRECCIA ↙
   ========================= */

        .reverse-arrow-down {
            bottom: 20px;
            right: 26px;
            border-bottom-right-radius: 10px;
            transform: rotate(-41deg);
            box-shadow: 2px 3px 3px rgba(0, 0, 0, 0.45);
        }

        .reverse-arrow-down::after {
            left: -22px;
            top: -8px;

            transform: rotate(180deg);
        }

        /* =========================
            UNO WILD
        ========================= */
        /* Contenitore delle 4 carte */
        .deck-wild .uno-symbol-plus-two,

            height: 70px;

        /* Mini carte */

        /* ROSSA */
        .deck-wild .mini-card-red {

            left: 34px;
            transform: rotate(27deg);

        /* GIALLA */
        .deck-wild .mini-card-yellow {
            background: #ffde17;
            top: 1px;
            left: 25px;
            transform: rotate(7deg);
        }

        /* VERDE */
        .deck-wild .mini-card-green {

            left: 13px;
            transform: rotate(-6deg);
        }

        /* BLU */
        .deck-wild .mini-card-blue {
            background: #0072bc;
            top: 4px;
            left: 0px;
            transform: rotate(-18deg);
        }

        .deck-card.uno.deck-wild>.card-content {

        /* Simbolo centrale */
        .deck-card.uno.deck-wild>.card-content>div:nth-child(2) {
            position: relative;

            line-height: 1;


            text-shadow: none;

        .deck-card.uno.deck-wild>.card-content:has(.uno-symbol-wild)>div:nth-child(2) {

        .uno-symbol-plus-two-white .mini-card {
            background: #fff;
        }

        .uno-symbol-plus-two {
            position: relative;
            width: 65px;
            height: 65px;

        /* Le due mini-carte */
        .uno-symbol-plus-two .mini-card {

            border-radius: 7px;

            box-shadow:

        /* Carta dietro */
        .uno-symbol-plus-two .mini-card-back {
            top: 5px;
            left: 7px;

            transform: rotate(-12deg);
            box-shadow:

        }

        /* Carta davanti */
        .uno-symbol-plus-two .mini-card-front {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

        async function playAgainstPC(gameId) {

            const difficulty = "easy";

            const snapshot = await get(gameRef);

            if (!snapshot.exists()) {
                console.log("Partita non trovata");
                return;
            }

            const game = snapshot.val();

            // ==========================================
            // COPIA LO STATO FIREBASE NEL GAMESTATE
            // ==========================================
            const gameState = loadGameState(1)
            gameState.board = game.board || {
                mainDeck: [],
                boardDeck: []
            };

            gameState.players = game.players || [];

            gameState.pcDifficulty = game.pcDifficulty;
            gameState.initialized = game.initialized === true;

            // ==========================================
            // AGGIUNGI IL PC
            // ==========================================

            if (!gameState.players.some(player => player.id === 2)) {

                gameState.players.push({
                    id: 2,
                    deck: []
                });
            }

            gameState.pcDifficulty = difficulty;

            // ==========================================
            // INIZIALIZZA SOLO UNA VOLTA
            // ==========================================

            if (gameState.initialized !== true) {
                initializeGame(gameState);
            }

            // ==========================================
            // RENDER
            // ==========================================

            drawBoard(1, gameState);

            // ==========================================
            // SALVA LO STESSO STATO
            // ==========================================

            await set(gameRef, gameState);
        }




        function handleClick(e) {
            const sq = e.target.closest(".card");

            if (!sq) return;
            if (sq.id == "uno-deck") {

                moveCards(
                    gameState.board.mainDeck,
                    gameState.players[0].deck, 1, true
                )
            } else {
                if (!checkGameRules('UNOleaveCard', {
                    cardToLeave: gameState.players[0].deck.filter(e => e.id == sq.id)[0],
                    cardOnBoard: gameState.board.boardDeck[0]
                })) {
                    return
                }
                moveCards(
                    gameState.players[0].deck,
                    gameState.board.boardDeck, 1, false, [parseInt(sq.id)],
                    true
                )
            }
            drawBoard(1, gameState)
            saveGameState(gameState)
            console.log(gameState)
        }


        function checkWild(cardToLeave, cardOnBoard) {

            if (!cardToLeave) {
                return false;
            }

            return (
                cardToLeave.type === "wild" ||
                cardToLeave.type === "wild-draw-four"
            );
        }


        function checkNumber(cardToLeave, cardOnBoard) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            // Controlliamo il numero solo se entrambe sono carte numeriche
            if (
                cardToLeave.type !== "number" ||
                cardOnBoard.type !== "number"
            ) {
                return false;
            }

            return cardToLeave.value === cardOnBoard.value;
        }


        function checkColor(cardToLeave, cardOnBoard) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            // Wild può essere giocata indipendentemente dal colore
            if (
                cardToLeave.type === "wild" ||
                cardToLeave.type === "wild-draw-four"
            ) {
                return true;
            }

            return cardToLeave.color === cardOnBoard.color;
        }


        function evaluateRules(rules, cardToLeave, cardOnBoard, mode = "all") {

            if (mode === "any") {

                return rules.some(rule =>
                    rule.check(cardToLeave, cardOnBoard)
                );

            }

            if (mode === "all") {

                return rules.every(rule =>
                    rule.check(cardToLeave, cardOnBoard)
                );

            }

            console.warn("Unknown rule mode:", mode);

            return false;
        }


        function checkGameRules(action, cards) {
            let allowed = false;

            const unoRules = [
                { name: "colorCheck", check: checkColor },
                { name: "numberCheck", check: checkNumber },
                { name: "wildCheck", check: checkWild }
            ];

            switch (action) {

                        case "UNOleaveCard":

                            console.log(
                                cards.cardToLeave,
                                cards.cardOnBoard
                            );

                            return evaluateRules(
                                unoRules,
                                cards.cardToLeave,
                                cards.cardOnBoard,
                                "any"
                            );


                        default: console.log("not managed rule: ", rule)
                    }
 
            return allowed
        }


        function saveGameState(gameState) {
            if (!gameState) return;


            console.log(
                gameState
            )
            return set(gameRef, gameState);
        }


        function generateDeck() {

            const deck = [];
            let id = 1;

            const colors = ["red", "yellow", "green", "blue"];

            colors.forEach(color => {

                // =========================
                // CARTA 0
                // =========================
                deck.push({
                    id: id++,
                    type: "number",
                    color: color,
                    value: 0
                });

                // =========================
                // CARTE 1 - 9
                // 2 copie per ogni numero
                // =========================
                for (let value = 1; value <= 9; value++) {

                    for (let i = 0; i < 2; i++) {

                        deck.push({
                            id: id++,
                            type: "number",
                            color: color,
                            value: value
                        });

                    }
                }

                // =========================
                // SKIP
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "skip",
                        color: color
                    });

                }

                // =========================
                // REVERSE
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "reverse",
                        color: color
                    });

                }

                // =========================
                // +2
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "draw-two",
                        color: color
                    });

                }
            });

            // =========================
            // WILD
            // 4 copie
            // =========================
            for (let i = 0; i < 4; i++) {

                deck.push({
                    id: id++,
                    type: "wild"
                });

            }

            // =========================
            // WILD +4
            // 4 copie
            // =========================
            for (let i = 0; i < 4; i++) {

                deck.push({
                    id: id++,
                    type: "wild-draw-four"
                });

            }

            // =========================
            // MESCOLA
            // =========================
            shuffleDeck(deck);

            return deck;
        }


        function shuffleDeck(deck) {

            for (let i = deck.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

        }


        function moveCards(
            sourceDeck,
            targetDeck,
            amount,
            random = true,
            cardIds = [],
            toTop = false
        ) {

            if (!sourceDeck || !targetDeck) {
                return;
            }

            if (amount <= 0 || sourceDeck.length === 0) {
                return;
            }

            // =========================
            // FUNZIONE INSERIMENTO
            // =========================

            function addCard(card) {

                if (toTop) {
                    targetDeck.unshift(card);
                } else {
                    targetDeck.push(card);
                }

            }

            // =========================
            // CARTE CASUALI
            // =========================

            if (random) {

                for (let i = 0; i < amount; i++) {

                    if (sourceDeck.length === 0) {
                        break;
                    }

                    const randomIndex = Math.floor(
                        Math.random() * sourceDeck.length
                    );

                    const card = sourceDeck.splice(randomIndex, 1)[0];

                    addCard(card);
                }

            }

            // =========================
            // CARTE SCELTE
            // =========================

            else {

                for (const cardId of cardIds) {

                    if (sourceDeck.length === 0) {
                        break;
                    }

                    const index = sourceDeck.findIndex(
                        card => card.id === cardId
                    );

                    if (index !== -1) {

                        const card = sourceDeck.splice(index, 1)[0];

                        addCard(card);
                    }
                }
            }
        }


        function dealCards(gameState) {

            if (!gameState || !gameState.board || !gameState.board.mainDeck) {
                return;
            }

            const mainDeck = gameState.board.mainDeck;

            // Svuota i deck dei giocatori
            gameState.players.forEach(player => {
                player.deck = [];
            });

            // =========================
            // 7 CARTE A OGNI GIOCATORE
            // =========================

            gameState.players.forEach(player => {

                moveCards(
                    mainDeck,
                    player.deck,
                    7,
                    true
                );

            });
        }


        function initializeGame(gameState) {

            if (!gameState) return;

            if (!gameState.players) {
                gameState.players = [];
            }

            if (!gameState.board) {
                gameState.board = {
                    mainDeck: [],
                    boardDeck: []
                };
            }

            // Se la partita è già inizializzata NON fare nulla
            if (gameState.initialized === true) {
                return gameState;
            }

            // ==========================================
            // NUOVA PARTITA
            // ==========================================

            gameState.board.mainDeck = generateDeck();

            gameState.board.boardDeck = [];

            // Svuota le mani SOLO all'inizio
            gameState.players.forEach(player => {
                player.deck = [];
            });

            // Distribuisce 7 carte
            dealCards(gameState);

            // Prima carta scoperta
            if (gameState.board.mainDeck.length > 0) {

                const randomIndex = Math.floor(
                    Math.random() * gameState.board.mainDeck.length
                );

                const card = gameState.board.mainDeck.splice(
                    randomIndex,
                    1
                )[0];

                gameState.board.boardDeck.push(card);
            }

            // IMPORTANTE
            gameState.initialized = true;

            return gameState;
        }


        function drawBoard(userId, gameState) {

            const player = gameState.players.find(player => player.id === userId);

            if (!player) return;

            const playerBoard = player.deck;

            const boards = [
                playerBoard,
                board2,
                boardDeck

            const boardElements = [
                boardElement,

                boardDeckElement
            ];

            boards.forEach((board, boardIndex) => {

                currentBoardElement.innerHTML = "";

                    board = board.slice(0, 1);

                        type = card.color + "-" + card.type
                    } else if (card.type == "wild-draw-four" || card.type == "wild-card") {
                        type = card.type
                    }

                    cardElement.className = "card " + type;
                    cardElement.id = card.id

                    if (card.type === "wild") {

                            <div class="uno-symbol-wild"></div>

                            <div class="uno-symbol-wild small-symbol"></div>

                        </div>
                    </div>
                `;
                    }

                    else if (card.type === "wild-gerry") {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-wild">

                            <div class="small-number">+20</div>

                            <div class="small-number">+20</div>

                        </div>
                    </div>
                `;

                    else if (card.type === "draw-two") {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-${card.color}">

                            <div class="small-number">+2</div>

                            </div>

                            <div class="small-number">+2</div>

                        </div>
                    </div>
                `;
                    }

                    else if (card.type === "wild-draw-four") {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-wild">
                        <div class="card-content">

                            <div class="small-number">+4</div>

                            <div class="uno-symbol-plus-four">
                                <span class="mini-card mini-card-blue"></span>

                                <span class="mini-card mini-card-yellow"></span>
                                <span class="mini-card mini-card-red"></span>
                            </div>

                            <div class="small-number">+4</div>

                        </div>
                    </div>
                `;
                    }

                    else if (card.type === "skip") {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-${card.color}">
                        <div class="card-content">

                            <div class="uno-skip small-symbol">
                                <span class="skip-circle"></span>
                                <span class="skip-bar"></span>
                            </div>

                            <div class="uno-skip">
                                <span class="skip-circle"></span>
                                <span class="skip-bar"></span>
                            </div>

                            <div class="uno-skip small-symbol">
                                <span class="skip-circle"></span>
                                <span class="skip-bar"></span>
                            </div>

                        </div>
                    </div>
                `;
                    }

                    else if (card.type === "reverse") {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-${card.color}">
                        <div class="card-content">

                            <div class="uno-reverse small-symbol">
                                <span class="reverse-arrow reverse-arrow-up"></span>
                                <span class="reverse-arrow reverse-arrow-down"></span>
                            </div>

                            <div class="uno-reverse">
                                <span class="reverse-arrow reverse-arrow-up"></span>
                                <span class="reverse-arrow reverse-arrow-down"></span>
                            </div>

                            <div class="uno-reverse small-symbol">
                                <span class="reverse-arrow reverse-arrow-up"></span>
                                <span class="reverse-arrow reverse-arrow-down"></span>
                            </div>

                        </div>
                    </div>
                `;
                    }

                    else {
                        cardElement.innerHTML = `
                    <div class="card-body deck-card uno deck-${card.color}">
                        <div class="card-content">

                            <div class="small-number">${card.value}</div>
                            <div class="large-number">${card.value}</div>
                            <div class="small-number">${card.value}</div>

                        </div>
                    </div>
                `;
                    }

                    currentBoardElement.appendChild(cardElement);


                    cardElement.addEventListener("click", e => handleClick(e));
                });
            });

            // ==================================================
            // AVVERSARI
            // ==================================================

            const opponentsBoard = document.getElementById("opponentsBoard");

            if (opponentsBoard) {

                opponentsBoard.innerHTML = "";

                const playersContainer = document.createElement("div");

                playersContainer.className = "d-flex flex-column justify-content-between";

                gameState.players.forEach(opponent => {

                    // Non mostrare il giocatore corrente
                    if (opponent.id === userId) return;

                    // Contenitore del giocatore
                    const opponentCards = document.createElement("div");

                    opponentCards.className = "opponent-cards";

                    // Nome giocatore
                    const title = document.createElement("h6");

                    title.style.marginRight = "40px";
                    title.style.marginBottom = "30px";
                    title.textContent = `Player ${opponent.id}`;

                    opponentCards.appendChild(title);

                    // Una carta coperta per ogni carta nel deck
                    opponent.deck.forEach(() => {

                        const opponentCard = document.createElement("div");

                        opponentCard.className = "opponent-card";

                        opponentCard.innerHTML = `
                <div class="card-body deck-card uno-back">
                    <div class="uno-back-oval">
                        <span>ONE</span>

                </div>
            `;

                        opponentCards.appendChild(opponentCard);
                    });

                    playersContainer.appendChild(opponentCards);
                });

                opponentsBoard.appendChild(playersContainer);
            }

        }


        function show(elements) {
            for (let element of elements) {
                if (element && element.style) {
                    element.style.display = "block";
                }
            }
        }

        function hide(elements) {
            for (let element of elements) {
                if (element && element.style) {
                    element.style.display = "none";
                }
            }
        }
