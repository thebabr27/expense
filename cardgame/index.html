<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');

        * {

            font-family: 'Luckiest Guy', cursive;
        }

        .game-actions {
            width: 100%;
            margin: 20px auto;
            text-align: center;
        }

        #game-actions-text {
            font-size: 1.2rem;
            font-weight: 200;
            min-height: 30px;
        }

        .game-modal {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.55);

            z-index: 9999;
        }

        .game-modal.show {
            display: flex;
        }

        .game-modal-content {
            position: relative;

            width: min(90%, 500px);
            min-height: 150px;

            padding: 30px;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;

            color: white;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .game-modal-close {
            position: absolute;

            top: 10px;
            right: 15px;

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background: transparent;

            color: white;
            font-size: 28px;
            line-height: 1;

            cursor: pointer;
        }

        .game-modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #gameModalBody {
            text-align: center;
        }

        .bg-semi-transparent {
            background: rgba(0, 0, 0, .5) !important;
        }

        .bg-semi-transparent h3 {
            color: white;
        }

        .opponents-board {
            position: fixed;
            top: 36%;
            right: 0;

            transform: translateY(-50%);

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 10px;

            pointer-events: none;
        }

        .flex-column:has(.opponent-cards) {
            height: 70vh;
        }

        .opponent-cards {
            margin-bottom: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
        }

        .opponent-card {
            width: 0px;
            height: 35px;
            margin-top: -15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .opponent-card .deck-card.uno-back {
            width: 140px;
            height: 200px;

            transform: rotate(90deg) scale(0.45);

            transform-origin: center center;

            flex-shrink: 0;
        }

        .card {
            border-radius: 20px;
            transform: scale(.8);
        }


        #boardDeck,
        #board2,
        #board {
            max-width: 600px;
        }

        @media (max-width: 600px) {


            .opponent-card .deck-card.uno-back {

                transform: rotate(90deg) scale(0.25);
            }
            #boardDeck,
            #board2,
            #board {
                max-width: 200px!important;
            }

            .card:has(.uno-back):hover {
                transform: translateY(-15px) scale(.6) !important;
            }

            .card:has(.uno-back),
            .card {
                transform: translateY(0px) scale(.6) !important;
            }

            /* Effetto hover */
            .card:has(.uno):hover,
            .card:has(.denari):hover {
                transform: translateY(-8px) scale(.6) !important;
            }
        }

        .card-body {
            padding: 0;
        }

        /* Colori Scopa */
        .deck-denari,
        .deck-spade,
        .deck-bastoni,
        .deck-coppe {
            background-color: #FFF;
        }

        /* =========================
   DORSO CARTA UNO
   ========================= */

        .deck-card.uno-back {
            position: relative;

            width: 140px;
            height: 200px;

            background: #000;

            border: 4px solid #fff;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;


            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.45),
                inset 0 0 0 2px rgba(255, 255, 255, 0.15);
        }


        /* =========================
   OVALE ROSSO
   ========================= */
        .card:has(.uno-back-oval) {
            transition: .2s;
            transform: scale(.8);
        }

        .card:has(.uno-back-oval):hover {
            transform: translateY(-15px) scale(.8);
        }

        .uno-back-oval {
            transition: .2s;
            width: 115px;
            height: 165px;

            background: #ed1c24;

            border: 4px solid #fff;
            border-radius: 50%;

            box-sizing: border-box;

            transform: rotate(27deg) skewX(-8deg);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                3px 4px 5px rgba(0, 0, 0, 0.45);
        }

        .card-content {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* =========================
   SCRITTA UNO
   ========================= */

        .uno-back-oval span {
            position: relative;

            color: #ffde17;
            text-shadow:
                0 0 2px #fff,
                0 0 5px #fff,
                0 0 8px rgba(255, 255, 255, 0.9),
                3px 4px 0 rgba(0, 0, 0, 0.45),
                4px 5px 4px rgba(0, 0, 0, 0.35);


            font-size: 50px;
            font-weight: 500;

            letter-spacing: 3px;

            /*
     * Compensa il rotate(27deg)
     * dell'ovale.
     */
            transform: rotate(-50deg);

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.25);

            white-space: nowrap;
        }

        /* =========================
   UNO WILD - CAMBIO COLORE
   ========================= */

        /* =========================
   SIMBOLO WILD - CAMBIO COLORE
   ========================= */

        /* =========================
   WILD - CAMBIO COLORE
   ========================= */
        .uno-deck-wild .uno-symbol-wild {

            transform: rotate(45deg) scale(1.5);
        }

        .uno-symbol-wild {
            position: relative;

            width: 82px;
            height: 118px;

            border: 4px solid #fff;
            border-radius: 50%;

            box-sizing: border-box;

            overflow: hidden;

            transform: rotate(-25deg) skewX(-8deg);

            background:
                conic-gradient(from 0deg,
                    #0072bc 0deg 45deg,
                    #00a651 45deg 155deg,
                    #ffde17 155deg 225deg,
                    #ed1c24 225deg 335deg,
                    #0072bc 335deg 360deg);

            box-shadow:
                2px 4px 4px rgba(0, 0, 0, 0.4);
        }


        /* =========================
   QUATTRO QUARTI
   ========================= */

        .wild-quarter {
            position: absolute;

            width: 50%;
            height: 50%;

            box-sizing: border-box;
        }


        /* BLU - alto sinistra */
        .wild-blue {
            top: 0;
            left: 0;
            background: #0072bc;
        }


        /* VERDE - alto destra */
        .wild-green {
            top: 0;
            right: 0;
            background: #00a651;
        }


        /* GIALLO - basso sinistra */
        .wild-yellow {
            bottom: 0;
            left: 0;
            background: #ffde17;
        }


        /* ROSSO - basso destra */
        .wild-red {
            bottom: 0;
            right: 0;
            background: #ed1c24;
        }

        /* =========================
   UNO SKIP / DIVIETO
   ========================= */

        .uno-skip {
            position: relative;

            width: 82px;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
   CERCHIO
   ========================= */

        .skip-circle {
            width: 65px;
            height: 65px;
            border: 9px solid #fff;
            border-radius: 50%;
            box-sizing: border-box;
            /* Ombra del cerchio */
            filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.45));
        }


        /* =========================
   BARRA DI DIVIETO
   ========================= */

        .skip-bar {
            position: absolute;
            margin-left: 1px;
            margin-top: 1px;
            width: 60px;
            height: 10px;
            background: #fff;
            border-radius: 6px;
            transform: rotate(-45deg);
        }

        /* =========================
   UNO REVERSE
   ========================= */

        .uno-reverse,
        .uno-reverse-small {
            position: relative;
            width: 80px;
            height: 80px;

        }


        /* Base comune delle frecce */
        .reverse-arrow {
            position: absolute;

            width: 33px;
            height: 14px;

            background: #fff;

            border-radius: 3px;

            transform-origin: center;

        }

        /* Punta triangolare */
        .reverse-arrow::after {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #fff;

            /* Ombra della punta */
            filter: drop-shadow(2px -3px 2px rgba(0, 0, 0, 0.45));
        }


        /* =========================
   FRECCIA ↗
   ========================= */

        .reverse-arrow-up {
            border-top-left-radius: 10px;
            top: 24px;
            left: 20px;
            transform: rotate(-41deg);
            box-shadow: -2px -3px 3px rgba(0, 0, 0, 0.45);
        }

        .reverse-arrow-up::after {
            right: -22px;
            top: -8px;

        }


        /* =========================
   FRECCIA ↙
   ========================= */

        .reverse-arrow-down {
            bottom: 20px;
            right: 26px;
            border-bottom-right-radius: 10px;
            transform: rotate(-41deg);
            box-shadow: 2px 3px 3px rgba(0, 0, 0, 0.45);
        }

        .reverse-arrow-down::after {
            left: -22px;
            top: -8px;

            transform: rotate(180deg);
        }

        /* VERDE */

        }

        /* BLU */

            background: #0072bc;

        /* Simbolo centrale */

        .deck-card.uno {
            position: relative;
            width: 140px;
            height: 200px;

            border: 4px solid #fff;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Sfondo carta */
        .deck-card.uno.deck-red {
            background: #ed1c24;
        }

        /* Ovale centrale: SOLO lui è ruotato */
        .deck-card.uno::before {
            content: "";

            position: absolute;

            width: 115px;
            height: 165px;

            border: 4px solid #fff;

            border-radius: 50%;

            transform: rotate(27deg) skewX(-8deg);

            box-sizing: border-box;
        }

        /* Tutto il contenuto sopra l'ovale */
        .deck-card.uno>.card-content>div {
            position: relative;
        }

        /* Numero centrale: DRITTO */
        .deck-card.uno>.card-content>div:nth-child(2) {
            font-size: 72px;

            color: #fff;

            line-height: 1;

            /* NESSUNA ROTAZIONE */
            transform: none;

            text-shadow: -5px 5px 0 rgba(0, 0, 0, 0.5);
        }

        /* Numero in alto */
        .deck-card.uno>.card-content>div.small-symbol:first-child {
            transform: scale(.4);
            transform-origin: top;
            left: -20px !important;
        }

        .deck-card.uno>.card-content>div.uno-symbol-wild:first-child {
            transform: scale(.3) rotate(45deg) translate(37px, -27px);
            transform-origin: top;
            left: -20px !important;
        }

        }

            top: 8px;

            color: #fff;
            font-size: 26px;

        }

        /* Numero in basso */

        function updateCurrentColor(gameState) {

            const button = document.getElementById("current-color");

            if (!button) return;

            const cardOnBoard = gameState?.board?.boardDeck?.[0];

            if (!cardOnBoard) {
                button.textContent = "Colore: -";
                return;
            }

            const color = cardOnBoard.color;

            if (!color) {
                button.textContent = "Colore: -";
                return;
            }

            const colors = {
                red: "Rosso",
                yellow: "Giallo",
                green: "Verde",
                blue: "Blu"
            };

            button.textContent =
                `Colore: ${colors[color] || color}`;
        }


        // =========================
        // APRI MODALE
        // =========================

        function openGameModal(content) {

            gameModalBody.innerHTML = content;

            gameModal.classList.add("show");
        }


        // =========================
        // CHIUDI MODALE
        // =========================

        function closeGameModal() {

            gameModal.classList.remove("show");

            gameModalBody.innerHTML = "";
        }


        async function loadGameState(gameId) {

            const snapshot = await get(gameRef);

            if (!snapshot.exists()) {
                console.log("Partita non trovata");
                return null;
            }

            gameState = snapshot.val();

            // ==========================================
            // VALORI DI DEFAULT
            // ==========================================

            if (gameState.turn === undefined) {
                gameState.turn = 1;
            }

            if (gameState.direction === undefined) {
                gameState.direction = 1;
            }

            if (gameState.currentColor === undefined) {
                gameState.currentColor =
                    gameState.board?.boardDeck?.[0]?.color || null;
            }

            // ==========================================
            // PENALITÀ +4
            // ==========================================

            gameState.drawFourPending =
                gameState.drawFourPending === true;

            gameState.drawFourPenalty =
                Number(gameState.drawFourPenalty) || 0;

            // ==========================================
            // PENALITÀ +2
            // ==========================================

            gameState.drawTwoPending =
                gameState.drawTwoPending === true;

            gameState.drawTwoPenalty =
                Number(gameState.drawTwoPenalty) || 0;

            console.log("GAME STATE:", gameState);

            updateCurrentColor(gameState);

            return gameState;
        }


        async function playAgainstPC(gameId) {

            await loadGameState(gameId);

            if (!gameState) {
                return;
            }

            console.log("PARTITA RIPRISTINATA:", gameState);

            // Assicuriamoci che la struttura esista
            if (!gameState.board) {
                gameState.board = {
                    mainDeck: [],
                    boardDeck: []
                };
            }

            if (!gameState.players) {
                gameState.players = [];
            }

            // Inizializza SOLO se è una partita nuova
            initializeGame(gameState);

            // Disegna lo stato salvato
            drawBoard(1, gameState);

            // Se il turno salvato appartiene alla CPU,
            // la CPU deve continuare a giocare
            if (gameState.turn !== 1) {
                console.log("Turno della CPU:", gameState.turn);

                await CPUplay();
            }
        }

        function checkDrawTwoPenalty(player, cardOnBoard) {

            if (!cardOnBoard || cardOnBoard.type !== "draw-two") {
                return false;
            }

            return !player.deck.some(
                card => card.type === "draw-two"
            );
        }

        async function handleClick(e) {

            const sq = e.target.closest(".card");

            if (!sq) return;

            const player = gameState.players[0];

            const cardOnBoard = gameState.board.boardDeck[0];


            // =========================
            // PESCA
            // =========================

            if (sq.id === "uno-deck") {

                // ==========================================
                // PENALITÀ +4
                // ==========================================

                if (gameState.drawFourPending === true) {

                    const penalty =
                        Number(gameState.drawFourPenalty) || 4;

                    moveCards(
                        gameState.board.mainDeck,
                        player.deck,
                        penalty,
                        true
                    );

                    await showGameAction(
                        `🃏 Player 1 pesca ${penalty} carte`
                    );

                    console.log(
                        `Player pesca ${penalty} carte per il +4`
                    );

                    // Penalità consumata
                    gameState.drawFourPending = false;
                    gameState.drawFourPenalty = 0;

                    // Passa il turno rispettando direction
                    nextTurn(gameState);

                    drawBoard(1, gameState);
                    await saveGameState(gameState);

                    if (gameState.turn !== 1) {
                        await CPUplay();
                    }

                    return;
                }


                // ==========================================
                // PENALITÀ +2
                // ==========================================

                if (gameState.drawTwoPending === true) {

                    const penalty =
                        Number(gameState.drawTwoPenalty) || 2;

                    moveCards(
                        gameState.board.mainDeck,
                        player.deck,
                        penalty,
                        true
                    );

                    await showGameAction(
                        `🃏 Player 1 pesca ${penalty} carte`
                    );

                    console.log(
                        `Player pesca ${penalty} carte per il +2`
                    );

                    gameState.drawTwoPending = false;
                    gameState.drawTwoPenalty = 0;

                    nextTurn(gameState);

                    drawBoard(1, gameState);
                    await saveGameState(gameState);

                    if (gameState.turn !== 1) {
                        await CPUplay();
                    }

                    return;
                }


                // =========================
                // PESCA NORMALE
                // =========================

                moveCards(
                    gameState.board.mainDeck,
                    player.deck,
                    1,
                    true
                );

                await showGameAction(
                    "🃏 Player 1 pesca 1 carta"
                );

                const drawnCard =
                    player.deck[player.deck.length - 1];

                console.log(
                    "Carta pescata:",
                    drawnCard
                );


                // =========================
                // CONTROLLO CARTA PESCATA
                // =========================

                const canPlayDrawnCard = checkGameRules(
                    "UNOleaveCard",
                    {
                        cardToLeave: drawnCard,
                        cardOnBoard: cardOnBoard
                    }
                );


                // =========================
                // CARTA NON GIOCABILE
                // =========================

                if (!canPlayDrawnCard) {

                    await showGameAction(
                        "⏭️ Player 1 passa il turno"
                    );

                    console.log(
                        "Carta pescata non giocabile → passa il turno"
                    );

                    nextTurn(gameState);

                    console.log(
                        "Dopo pesca:",
                        {
                            turn: gameState.turn,
                            direction: gameState.direction
                        }
                    );

                    drawBoard(1, gameState);
                    await saveGameState(gameState);

                    if (gameState.turn !== 1) {
                        await CPUplay();
                    }

                    return;
                }


                // =========================
                // CARTA PESCATA GIOCABILE
                // =========================

                console.log(
                    "Carta pescata giocabile → rimane il turno del player"
                );

                drawBoard(1, gameState);

                await saveGameState(gameState);

                return;
            }


            // =========================
            // GIOCA CARTA
            // =========================

            const cardId = parseInt(sq.id);

            const cardToLeave = player.deck.find(
                card => card.id === cardId
            );

            if (!cardToLeave) {
                return;
            }


            // =========================
            // CONTROLLO REGOLE
            // =========================

            if (!checkGameRules("UNOleaveCard", {
                cardToLeave: cardToLeave,
                cardOnBoard: cardOnBoard
            })) {
                return;
            }


            // =========================
            // SPOSTA CARTA SUL BOARD
            // =========================

            moveCards(
                player.deck,
                gameState.board.boardDeck,
                1,
                false,
                [cardId],
                true
            );


            // =========================
            // MOSTRA CARTA GIOCATA
            // =========================

            await showGameAction(
                `🎴 Player 1 gioca ${getCardName(cardToLeave)}`
            );


            // =========================
            // VITTORIA
            // =========================

            if (checkWinner(player)) {

                await saveGameState(gameState);
                drawBoard(1, gameState);

                return;
            }


            // =========================
            // WILD / +4
            // =========================

            if (
                cardToLeave.type === "wild" ||
                cardToLeave.type === "wild-draw-four" ||
                cardToLeave.type === "wild-gerry"
            ) {

                const selectedColor = await chooseColor();

                cardToLeave.color = selectedColor;

                gameState.currentColor = selectedColor;

                console.log(
                    "Colore scelto:",
                    selectedColor
                );


                // ==========================================
                // +20
                // ==========================================

                if (cardToLeave.type === "wild-gerry") {

                    gameState.drawFourPending = true;

                    gameState.drawFourPenalty =
                        Number(gameState.drawFourPenalty) || 0;

                    gameState.drawFourPenalty += 20;

                    console.log(
                        "Player ha giocato +20 → penalità totale:",
                        gameState.drawFourPenalty
                    );
                }


                // ==========================================
                // +4
                // ==========================================

                if (cardToLeave.type === "wild-draw-four") {

                    gameState.drawFourPending = true;

                    gameState.drawFourPenalty =
                        Number(gameState.drawFourPenalty) || 0;

                    gameState.drawFourPenalty += 4;

                    console.log(
                        "Player ha giocato +4 → penalità totale:",
                        gameState.drawFourPenalty
                    );
                }
            }


            // =========================
            // CARTA COLORATA NORMALE
            // =========================

            else {

                gameState.currentColor = cardToLeave.color;
            }


            // =========================
            // +2
            // =========================

            if (cardToLeave.type === "draw-two") {

                gameState.drawTwoPending = true;

                gameState.drawTwoPenalty =
                    Number(gameState.drawTwoPenalty) || 0;

                gameState.drawTwoPenalty += 2;

                console.log(
                    "Player ha giocato +2 → penalità totale:",
                    gameState.drawTwoPenalty
                );
            }


            // =========================
            // REVERSE
            // =========================

            if (cardToLeave.type === "reverse") {

                gameState.direction *= -1;

                console.log(
                    "Cambio direzione:",
                    gameState.direction
                );

                await showGameAction(
                    "🔄 Turno invertito"
                );
            }


            // =========================
            // SKIP
            // =========================

            const skipTurn =
                cardToLeave.type === "skip";

            if (skipTurn) {

                await showGameAction(
                    "⏭️ Il prossimo giocatore salta il turno"
                );
            }


            // =========================
            // CAMBIO TURNO
            // =========================

            nextTurn(gameState, skipTurn);


            console.log(
                "Prossimo turno:",
                {
                    turn: gameState.turn,
                    direction: gameState.direction
                }
            );


            drawBoard(1, gameState);

            await saveGameState(gameState);


            if (gameState.turn !== 1) {
                await CPUplay();
            }
        }


        function showReverseModal(player) {
            openGameModal(`
        <div class="py-3">
            <h2 class="fw-bold mb-3">🔄 Turno invertito!</h2>
            <p class="mb-0">
                ${player.id === 1 ? "Player 1" : `Player ${player.id}`} ha giocato <strong>Reverse</strong>.
            </p>
        </div>
    `);
        }

        function showSkipModal(player) {
            openGameModal(`
        <div class="py-3">
            <h2 class="fw-bold mb-3">⏭️ Turno saltato!</h2>
            <p class="mb-0">
                ${player.id === 1 ? "Player 1" : `Player ${player.id}`} ha giocato <strong>Skip</strong>.
            </p>
        </div>
    `);
        }


        function showWinnerModal(player) {

            const playerName =
                player.id === 1
                    ? "Player 1"
                    : `Player ${player.id}`;

            openGameModal(`
        <div class="py-3">

            <h1 class="fw-bold mb-4">
                ${playerName} vince!
            </h1>

            <button
                id="modal-new-game"
                type="button"
                class="btn btn-primary px-4"
            >
                Nuova partita
            </button>

        </div>
    `);

            document
                .getElementById("modal-new-game")
                .addEventListener("click", async () => {

                    closeGameModal();

                    await newGame();
                });
        }


        function checkWinner(player) {

            if (!player) return false;

            if (player.deck.length === 0) {

                console.log(
                    `Player ${player.id} ha vinto!`
                );

                showWinnerModal(player);

                return true;
            }

            return false;
        }


        function checkType(cardToLeave, cardOnBoard) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            return (
                cardToLeave.type === cardOnBoard.type &&
                cardToLeave.type !== "number"
            );
        }


        async function checkTurn() {

            if (gameState.turn !== 1) {
                await CPUplay();
            }
        }


        function chooseColor() {

            return new Promise(resolve => {

                openGameModal(`
            <h4>Scegli un colore</h4>

            <div class="d-flex justify-content-center gap-3 mt-4">

                <button
                    type="button"
                    class="btn btn-danger color-choice"
                    data-color="red"
                >
                    Rosso
                </button>

                <button
                    type="button"
                    class="btn btn-warning color-choice"
                    data-color="yellow"
                >
                    Giallo
                </button>

                <button
                    type="button"
                    class="btn btn-success color-choice"
                    data-color="green"
                >
                    Verde
                </button>

                <button
                    type="button"
                    class="btn btn-primary color-choice"
                    data-color="blue"
                >
                    Blu
                </button>

            </div>
        `);

                const buttons = document.querySelectorAll(
                    ".color-choice"
                );

                buttons.forEach(button => {

                    button.addEventListener("click", () => {

                        const color = button.dataset.color;

                        closeGameModal();

                        resolve(color);

                    });

                });

            });
        }


        function cpuCallUno(cpu) {

            if (!cpu || cpu.deck.length !== 1) {
                return;
            }

            openGameModal(`
        <div class="py-3">
            <h1 class="fw-bold mb-3">UNO!</h1>
            <p class="mb-0">
                🖥️ Il Player ${cpu.id} esclama UNO!
            </p>
        </div>
    `);
        }
        async function CPUplay() {

            const cpu = gameState.players.find(
                player => player.id === gameState.turn
            );

            if (!cpu) {
                console.error("CPU non trovata:", gameState.turn);
                return;
            }

            // Simula il tempo di pensiero
            await new Promise(resolve => setTimeout(resolve, 1500));

            const cardOnBoard = gameState.board.boardDeck[0];


            // ==========================================
            // PENALITÀ +4
            // ==========================================

            if (gameState.drawFourPending === true) {

                const wildDrawFour = cpu.deck.find(
                    card => card.type === "wild-draw-four"
                );


                // ==========================================
                // CPU RISPONDE CON +4
                // ==========================================

                if (wildDrawFour) {

                    moveCards(
                        cpu.deck,
                        gameState.board.boardDeck,
                        1,
                        false,
                        [wildDrawFour.id],
                        true
                    );

                    await showGameAction(
                        `🎴 Player ${cpu.id} gioca +4`
                    );


                    // ==========================================
                    // VITTORIA
                    // ==========================================

                    if (checkWinner(cpu)) {

                        await saveGameState(gameState);
                        drawBoard(1, gameState);

                        return;
                    }


                    const colors = [
                        "red",
                        "yellow",
                        "green",
                        "blue"
                    ];

                    const selectedColor =
                        colors[
                        Math.floor(Math.random() * colors.length)
                        ];


                    wildDrawFour.color = selectedColor;

                    gameState.currentColor = selectedColor;


                    // Accumula la penalità
                    gameState.drawFourPending = true;

                    gameState.drawFourPenalty =
                        Number(gameState.drawFourPenalty) || 4;

                    gameState.drawFourPenalty += 4;


                    console.log(
                        `CPU ${cpu.id} risponde con +4 → penalità totale: ${gameState.drawFourPenalty}`
                    );


                    if (cpu.deck.length === 1) {
                        cpuCallUno(cpu);
                    }

                }


                // ==========================================
                // CPU NON HA +4 → PESCA PENALITÀ
                // ==========================================

                else {

                    const penalty =
                        Number(gameState.drawFourPenalty) || 4;

                    moveCards(
                        gameState.board.mainDeck,
                        cpu.deck,
                        penalty,
                        true
                    );


                    await showGameAction(
                        `🃏 Player ${cpu.id} pesca ${penalty} carte`
                    );


                    console.log(
                        `CPU ${cpu.id} pesca ${penalty} carte per il +4`
                    );


                    gameState.drawFourPending = false;
                    gameState.drawFourPenalty = 0;


                    await showGameAction(
                        `⏭️ Player ${cpu.id} passa il turno`
                    );
                }


                nextTurn(gameState);

                drawBoard(1, gameState);
                await saveGameState(gameState);


                if (gameState.turn !== 1) {
                    await CPUplay();
                }

                return;
            }


            // ==========================================
            // PENALITÀ +2
            // ==========================================

            if (gameState.drawTwoPending === true) {

                const drawTwoCard = cpu.deck.find(
                    card => card.type === "draw-two"

                    );


                    if (cpu.deck.length === 1) {
                        cpuCallUno(cpu);

                // ==========================================

                // ==========================================

                else {

                    const penalty =

                    moveCards(

                        penalty,
                        true
                    );

                        `⏭️ Player ${cpu.id} passa il turno`
                    );
                }


                nextTurn(gameState);

                drawBoard(1, gameState);
                await saveGameState(gameState);


                if (gameState.turn !== 1) {
                    await CPUplay();
                }

                return;
            }


            // ==========================================
            // GIOCO NORMALE
            // ==========================================

            const playableCards = cpu.deck.filter(card => {

                return checkGameRules("UNOleaveCard", {
                    cardToLeave: card,
                    cardOnBoard: cardOnBoard
                });

            });


            if (playableCards.length > 0) {

                const cardToPlay =
                    playableCards[

                    ];


                moveCards(

                );

                // ==========================================

                // ==========================================

                if (

                // ==========================================

                // ==========================================

                if (cardToPlay.type === "wild-gerry") {

                    );

                // ==========================================
                // +4
                // ==========================================

                if (cardToPlay.type === "wild-draw-four") {

                    gameState.drawFourPending = true;

                    gameState.drawFourPenalty = 4;


                    console.log(
                        "CPU ha giocato +4 → penalità:",

                    );
                }


                // ==========================================
                // +2
                // ==========================================

                if (cardToPlay.type === "draw-two") {

                    gameState.drawTwoPending = true;

                    gameState.drawTwoPenalty = 2;


                    console.log(
                        "CPU ha giocato +2 → penalità:",
                        gameState.drawTwoPenalty
                    );
                }


                // ==========================================
                // REVERSE
                // ==========================================

                if (cardToPlay.type === "reverse") {

                    gameState.direction *= -1;


                    console.log(
                        "REVERSE! Nuova direzione:",
                        gameState.direction
                    );


                    await showGameAction(

                // ==========================================

                // ==========================================

                if (cpu.deck.length === 1) {
                    cpuCallUno(cpu);
                }


                // ==========================================
                // SKIP
                // ==========================================

                const skipTurn =
                    cardToPlay.type === "skip";


                if (skipTurn) {

                // ==========================================

                // ==========================================

            // ==========================================

            // ==========================================

            else {

                moveCards(

        function checkWildDrawFourPenalty(player, cardOnBoard) {

            if (
                !cardOnBoard ||
                cardOnBoard.type !== "wild-draw-four"
            ) {
                return false;
            }

            return !player.deck.some(
                card => card.type === "wild-draw-four"
            );
        }


        function checkDrawTwo(cardToLeave, cardOnBoard) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            return (
                cardToLeave.type === "draw-two" &&
                cardOnBoard.type === "draw-two"
            );
        }


        function checkWild(cardToLeave, cardOnBoard) {

            if (!cardToLeave) {
                return false;
            }

            return (
                cardToLeave.type === "wild" ||
                cardToLeave.type === "wild-draw-four" ||
                cardToLeave.type === "wild-gerry"
            );
        }


        function checkNumber(cardToLeave, cardOnBoard) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            // Controlliamo il numero solo se entrambe sono carte numeriche
            if (
                cardToLeave.type !== "number" ||
                cardOnBoard.type !== "number"
            ) {
                return false;
            }

            return cardToLeave.value === cardOnBoard.value;
        }


        function checkColor(cardToLeave, cardOnBoard, currentColor = null) {

            if (!cardToLeave || !cardOnBoard) {
                return false;
            }

            if (
                cardToLeave.type === "wild" ||
                cardToLeave.type === "wild-draw-four"
            ) {
                return true;
            }

            const boardColor =
                currentColor || cardOnBoard.color;

            return cardToLeave.color === boardColor;
        }


        function evaluateRules(rules, cardToLeave, cardOnBoard, mode = "all") {

            if (mode === "any") {

                return rules.some(rule =>
                    rule.check(cardToLeave, cardOnBoard)
                );

            }

            if (mode === "all") {

                return rules.every(rule =>
                    rule.check(cardToLeave, cardOnBoard)
                );

            }

            console.warn("Unknown rule mode:", mode);

            return false;
        }


        function checkGameRules(action, cards) {

            const unoRules = [
                {
                    name: "colorCheck",
                    check: (cardToLeave, cardOnBoard) =>
                        checkColor(
                            cardToLeave,
                            cardOnBoard,
                            gameState.currentColor
                        )
                },
                {
                    name: "numberCheck",
                    check: checkNumber
                },
                {
                    name: "typeCheck",
                    check: checkType
                },
                {
                    name: "wildCheck",
                    check: checkWild
                },
                {
                    name: "drawTwoCheck",
                    check: checkDrawTwo
                }
            ];

            switch (action) {

                case "UNOleaveCard":

                    return evaluateRules(
                        unoRules,
                        cards.cardToLeave,
                        cards.cardOnBoard,
                        "any"
                    );

                default:

                    console.log(
                        "not managed rule:",
                        action
                    );

                    return false;
            }
        }

        function generateDeck() {

            const deck = [];
            let id = 1;

            const colors = ["red", "yellow", "green", "blue"];

            colors.forEach(color => {

                // =========================
                // CARTA 0
                // =========================
                deck.push({
                    id: id++,
                    type: "number",
                    color: color,
                    value: 0
                });

                // =========================
                // CARTE 1 - 9
                // 2 copie per ogni numero
                // =========================
                for (let value = 1; value <= 9; value++) {

                    for (let i = 0; i < 2; i++) {

                        deck.push({
                            id: id++,
                            type: "number",
                            color: color,
                            value: value
                        });

                    }
                }

                // =========================
                // SKIP
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "skip",
                        color: color
                    });

                }

                // =========================
                // REVERSE
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "reverse",
                        color: color
                    });

                }

                // =========================
                // +2
                // 2 copie
                // =========================
                for (let i = 0; i < 2; i++) {

                    deck.push({
                        id: id++,
                        type: "draw-two",
                        color: color
                    });

                }
            });

            // =========================
            // WILD
            // 4 copie
            // =========================
            for (let i = 0; i < 4; i++) {

                deck.push({
                    id: id++,
                    type: "wild"
                });

            }

            // =========================
            // WILD +4
            // 4 copie
            // =========================
            for (let i = 0; i < 4; i++) {

                deck.push({
                    id: id++,
                    type: "wild-draw-four"
                });

            }

            deck.push({
                id: id++,
                type: "wild-gerry"
            });

            // =========================
            // MESCOLA
            // =========================
            shuffleDeck(deck);

            return deck;
        }


        function shuffleDeck(deck) {

            for (let i = deck.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

        }


        function moveCards(
            sourceDeck,
            targetDeck,
            amount,
            random = true,
            cardIds = [],
            toTop = false
        ) {

            if (!sourceDeck || !targetDeck) {
                return;
            }

            if (amount <= 0 || sourceDeck.length === 0) {
                return;
            }

            // =========================
            // FUNZIONE INSERIMENTO
            // =========================

            function addCard(card) {

                if (toTop) {
                    targetDeck.unshift(card);
                } else {
                    targetDeck.push(card);
                }

            }

            // =========================
            // CARTE CASUALI
            // =========================

            if (random) {

                for (let i = 0; i < amount; i++) {

                    if (sourceDeck.length === 0) {
                        break;
                    }

                    const randomIndex = Math.floor(
                        Math.random() * sourceDeck.length
                    );

                    const card = sourceDeck.splice(randomIndex, 1)[0];

                    addCard(card);
                }

            }

            // =========================
            // CARTE SCELTE
            // =========================

            else {

                for (const cardId of cardIds) {

                    if (sourceDeck.length === 0) {
                        break;
                    }

                    const index = sourceDeck.findIndex(
                        card => card.id === cardId
                    );

                    if (index !== -1) {

                        const card = sourceDeck.splice(index, 1)[0];

                        addCard(card);
                    }
                }
            }
        }


        function dealCards(gameState) {

            if (!gameState || !gameState.board || !gameState.board.mainDeck) {
                return;
            }

            const mainDeck = gameState.board.mainDeck;

            // Svuota i deck dei giocatori
            gameState.players.forEach(player => {
                player.deck = [];
            });

            // =========================
            // 7 CARTE A OGNI GIOCATORE
            // =========================

            gameState.players.forEach(player => {

                moveCards(
                    mainDeck,
                    player.deck,
                    7,
                    true
                );

            });
        }


        function nextTurn(gameState, skip = false) {

            // Primo passaggio al giocatore successivo
            gameState.turn += gameState.direction;

            if (gameState.turn > gameState.players.length) {
                gameState.turn = 1;
            }

            if (gameState.turn < 1) {
                gameState.turn = gameState.players.length;
            }

            // Skip: salta un altro giocatore
            if (skip) {

                gameState.turn += gameState.direction;

                if (gameState.turn > gameState.players.length) {
                    gameState.turn = 1;
                }

                if (gameState.turn < 1) {
                    gameState.turn = gameState.players.length;
                }
            }

            return gameState.turn;
        }


        function initializeGame(gameState) {

            if (!gameState) return;

            if (!gameState.players) {
                gameState.players = [];
            }

            if (!gameState.board) {
                gameState.board = {
                    mainDeck: [],
                    boardDeck: []
                };
            }

            if (gameState.turn === undefined) {
                gameState.turn = 1;
            }

            if (gameState.direction === undefined) {
                gameState.direction = 1;
            }

            // Se la partita è già inizializzata NON fare nulla
            if (gameState.initialized === true) {
                return gameState;
            }

            // ==========================================
            // NUOVA PARTITA
            // ==========================================

            gameState.board.mainDeck = generateDeck();

            gameState.board.boardDeck = [];

            // Svuota le mani SOLO all'inizio
            gameState.players.forEach(player => {
                player.deck = [];
            });

            // Distribuisce 7 carte
            dealCards(gameState);

            // Prima carta scoperta
            if (gameState.board.mainDeck.length > 0) {

                const randomIndex = Math.floor(
                    Math.random() * gameState.board.mainDeck.length
                );

                const validStartingCards =
                    gameState.board.mainDeck.filter(
                        card =>
                            card.type === "number"
                    );

                if (validStartingCards.length > 0) {

                    const randomIndex =
                        Math.floor(
                            Math.random() * validStartingCards.length
                        );

                    const card =
                        validStartingCards[randomIndex];

                    const deckIndex =
                        gameState.board.mainDeck.findIndex(
                            deckCard => deckCard.id === card.id
                        );

                    gameState.board.mainDeck.splice(deckIndex, 1);

                    gameState.board.boardDeck.push(card);

                    gameState.currentColor = card.color;
                }
            }

            // IMPORTANTE
            gameState.initialized = true;

            return gameState;
        }

                    playersContainer.appendChild(opponentCards);
                });

                opponentsBoard.appendChild(playersContainer);
            }

        }


        function getCardName(card) {

            if (!card) return "carta";

            const colors = {
                red: "Rosso",
                yellow: "Giallo",
                green: "Verde",
                blue: "Blu"
            };

            const color = colors[card.color] || "";

            switch (card.type) {

                case "number":
                    return `${color} ${card.value}`;

                case "skip":
                    return `${color} Skip`;

                case "reverse":
                    return `${color} Reverse`;

                case "draw-two":
                    return `${color} +2`;

                case "wild":
                    return "Wild";

                case "wild-draw-four":
                    return "+4";

                case "wild-gerry":
                    return "+20";

                default:
                    return "carta";
            }
        }


        function showGameAction(message) {
            const actions = document.getElementById("game-actions-text");

            if (!actions) return;

            actions.textContent = message;
        }


        function show(elements) {
            for (let element of elements) {
                if (element && element.style) {
                    element.style.display = "block";
                }
            }
        }

        function hide(elements) {
            for (let element of elements) {
                if (element && element.style) {
                    element.style.display = "none";
                }
            }
        }
    </script>
</body>

</html>
